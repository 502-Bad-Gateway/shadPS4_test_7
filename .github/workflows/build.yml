name: Build and Release

on:
  push:
    branches-ignore: [Pre-release-shadPS4-*, win7-v1-compat-only, PS4_external_base]
    paths-ignore:
      - "documents/**"
      - "**/*.md"

  pull_request:
    paths-ignore:
      - "documents/**"
      - "**/*.md"

  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  BUILD_TYPE: Release

jobs:
  reuse:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
    - uses: actions/checkout@v6
    - uses: fsfe/reuse-action@v6

  clang-format:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Install
      run: |
        wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
        sudo add-apt-repository 'deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main'
        sudo apt update
        sudo apt install clang-format-19
    - name: Build
      env:
        COMMIT_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
      run: ./.github/workflows/scripts/clang-format.sh

  get-info:
    runs-on: ubuntu-24.04
    outputs:
      date: ${{ steps.vars.outputs.date }}
      shorthash: ${{ steps.vars.outputs.shorthash }}
      fullhash: ${{ steps.vars.outputs.fullhash }}
    steps:
    - uses: actions/checkout@v6
    - name: Get date and git hash
      id: vars
      run: |
        echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
        echo "shorthash=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        echo "fullhash=$(git rev-parse HEAD)" >> $GITHUB_ENV
        echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
        echo "shorthash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "fullhash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  test:
    name: Run C++ Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-26]
        include:
          - os: windows-latest
            compiler_cxx: clang-cl
            compiler_c: clang-cl
          - os: ubuntu-latest
            compiler_cxx: clang++
            compiler_c: clang
          - os: macos-26
            compiler_cxx: clang++
            compiler_c: clang
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Setup CMake
      uses: lukka/get-cmake@latest
    - name: Build tests
      shell: bash
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_C_COMPILER=${{ matrix.compiler_c }} \
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler_cxx }} \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DENABLE_TESTS=ON \
          -DENABLE_QT_GUI=OFF
        cmake --build build --parallel
    - name: Run tests
      shell: bash
      run: ctest --test-dir build --output-on-failure

  build:
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    needs: get-info
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            compiler_cxx: clang-cl
            compiler_c: clang-cl
          - os: ubuntu-latest
            arch: x64
            compiler_cxx: clang++
            compiler_c: clang
          - os: macos-26
            arch: arm64
            compiler_cxx: clang++
            compiler_c: clang
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Setup CMake
      uses: lukka/get-cmake@latest
    - name: Configure
      shell: bash
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_C_COMPILER=${{ matrix.compiler_c }} \
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler_cxx }} \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DENABLE_DISCORD_RPC=OFF \
          -DENABLE_UPDATER=OFF
    - name: Build
      shell: bash
      run: cmake --build build --parallel
