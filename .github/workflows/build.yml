name: Build and Release

# Temporary one-shot lightweight run. It uses the same concurrency group as the
# original multi-OS workflow so this push cancels the already-running generic CI.
on:
  push:
    branches: [win7-v1-dumb-gpu]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cancel-old-generic-build:
    runs-on: ubuntu-latest
    steps:
      - name: Generic CI disabled for this branch
        run: echo "Cancelling the previous multi-OS Build and Release run; Win7 dumb-GPU uses its dedicated workflow."
