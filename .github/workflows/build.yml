name: Build and Release

# PS4_external_base is an isolated Windows 7 GPU-development branch.
# The generic upstream multi-platform build is intentionally manual-only here.
# Dedicated Win7 host / external-GPU workflows handle this branch instead.
on:
  workflow_dispatch:

jobs:
  manual-only:
    runs-on: ubuntu-latest
    steps:
      - name: Explain branch policy
        run: |
          echo "PS4_external_base does not run the generic Build and Release workflow automatically."
          echo "Use the dedicated Win7 external GPU workflows for development builds."
