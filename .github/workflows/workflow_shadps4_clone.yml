# Build 13 retry after function-boundary transform fix
name: workflow_shadps4_clone

on:
  push:
    branches: [shadps4_clone_build13]
    paths:
      - CMakeLists.txt
      - src/**
      - tests/**
      - tools/win7-launcher/**
      - ci/**
      - .github/workflows/workflow_shadps4_clone.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPERIMENT_ITERATION: "13"
  EXPERIMENT_NAME: "driveclub-native-depthless-seed"
  ARTIFACT_BRANCH: "shadps4_clone"

jobs:
  build-win7-x64:
    name: Build Windows 7 x64 SafeGPU Build 13
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Apply Build 09-r2, Build 10, Build 11, Build 12 and Build 13 source changes
        shell: pwsh
        run: |
          $r2Patch = Join-Path $env:GITHUB_WORKSPACE 'ci/build09r2-preserve-fragment-binding-slots.patch'
          git apply --recount --check $r2Patch
          if ($LASTEXITCODE -ne 0) { throw 'Build 09-r2 source patch check failed' }
          git apply --recount $r2Patch
          if ($LASTEXITCODE -ne 0) { throw 'Build 09-r2 source patch apply failed' }

          $build10Patch = Join-Path $env:GITHUB_WORKSPACE 'ci/build10-disable-push-descriptors.patch'
          git apply --recount --check $build10Patch
          if ($LASTEXITCODE -ne 0) { throw 'Build 10 source patch check failed' }
          git apply --recount $build10Patch
          if ($LASTEXITCODE -ne 0) { throw 'Build 10 source patch apply failed' }

          & (Join-Path $env:GITHUB_WORKSPACE 'ci/apply-build11.ps1')
          & (Join-Path $env:GITHUB_WORKSPACE 'ci/fix-build11-draw-sites.ps1')
          & (Join-Path $env:GITHUB_WORKSPACE 'ci/apply-build12.ps1')
          & (Join-Path $env:GITHUB_WORKSPACE 'ci/apply-build13.ps1')

          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Build 13 transformed source failed git diff --check' }

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Fetch llvm-mingw launcher and audit tools
        shell: pwsh
        run: |
          $version = '20260616'
          $archiveName = "llvm-mingw-$version-msvcrt-x86_64.zip"
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          $parent = Join-Path $env:RUNNER_TEMP 'llvm-mingw'
          Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/$version/$archiveName" -OutFile $archive
          New-Item -ItemType Directory -Force -Path $parent | Out-Null
          Expand-Archive -Path $archive -DestinationPath $parent
          $root = Join-Path $parent "llvm-mingw-$version-msvcrt-x86_64"
          "LLVM_MINGW_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Visual Studio build environment
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      - name: Prepare launcher dependency
        shell: pwsh
        run: |
          $jsonDir = Join-Path $env:GITHUB_WORKSPACE 'tools/win7-launcher/third_party/nlohmann'
          New-Item -ItemType Directory -Force -Path $jsonDir | Out-Null
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/nlohmann/json/v3.12.0/single_include/nlohmann/json.hpp' -OutFile (Join-Path $jsonDir 'json.hpp')

      - name: Configure Windows 7 Vulkan 1.2 build
        shell: pwsh
        run: |
          $env:SOURCE_DATE_EPOCH = '0'
          $env:TZ = 'UTC'
          cmake -S . -B build-win7-safe-gpu -G Ninja -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_BUILD_TYPE=Release -DENABLE_WINDOWS_7_COMPAT=ON -DENABLE_WINDOWS_7_COMPAT_ONLY=ON -DENABLE_DISCORD_RPC=OFF -DENABLE_UPDATER=OFF -DENABLE_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }

      - name: Build emulator
        shell: pwsh
        run: |
          cmake --build build-win7-safe-gpu --target shadps4 --parallel $env:NUMBER_OF_PROCESSORS
          if ($LASTEXITCODE -ne 0) { throw 'shadPS4 build failed' }

      - name: Build Windows 7 launcher
        shell: pwsh
        run: |
          $bin = Join-Path $env:LLVM_MINGW_ROOT 'bin'
          $cxx = Join-Path $bin 'x86_64-w64-mingw32-clang++.exe'
          $rc = Join-Path $bin 'x86_64-w64-mingw32-windres.exe'
          if (!(Test-Path $rc)) { $rc = Join-Path $bin 'llvm-windres.exe' }
          $launcher = Join-Path $env:GITHUB_WORKSPACE 'tools/win7-launcher'
          $res = Join-Path $env:RUNNER_TEMP 'shadps4-win7-launcher.res'
          $exe = Join-Path $env:RUNNER_TEMP 'shadps4-win7-launcher.exe'
          Push-Location $launcher
          try {
              & $rc -I . launcher.rc -O coff -o $res
              if ($LASTEXITCODE -ne 0) { throw 'launcher resource compilation failed' }
              & $cxx '-std=c++17' '-O2' '-DNDEBUG' '-DUNICODE' '-D_UNICODE' '-D_WIN32_WINNT=0x0601' '-DWINVER=0x0601' '-I' '.' 'main.cpp' $res '-o' $exe '-mwindows' '-municode' '-static' '-fuse-ld=lld' '-Wl,--subsystem,windows:6.01' '-Wl,--disable-high-entropy-va' '-lcomctl32' '-lcomdlg32' '-lshell32' '-lgdi32' '-lole32' '-luuid'
              if ($LASTEXITCODE -ne 0) { throw 'launcher build failed' }
          } finally {
              Pop-Location
          }

      - name: Package SafeGPU artifact
        shell: pwsh
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE 'artifact'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'build-win7-safe-gpu/shadps4.exe') (Join-Path $output 'shadps4.exe')
          Copy-Item (Join-Path $env:RUNNER_TEMP 'shadps4-win7-launcher.exe') (Join-Path $output 'shadps4-win7-launcher.exe')
          Copy-Item LICENSE (Join-Path $output 'LICENSE-shadPS4')
          Copy-Item tools/win7-launcher/LICENSE-GPL-2.0-or-later.txt (Join-Path $output 'LICENSE-win7-launcher-GPL-2.0-or-later.txt')
          Copy-Item ci/build09r2-preserve-fragment-binding-slots.patch (Join-Path $output 'BUILD09-R2-SOURCE.patch')
          Copy-Item ci/build10-disable-push-descriptors.patch (Join-Path $output 'BUILD10-SOURCE.patch')
          Copy-Item ci/apply-build11.ps1 (Join-Path $output 'BUILD11-SOURCE.ps1')
          Copy-Item ci/fix-build11-draw-sites.ps1 (Join-Path $output 'BUILD11-DRAWSITE-FIX.ps1')
          Copy-Item ci/apply-build12.ps1 (Join-Path $output 'BUILD12-SOURCE.ps1')
          Copy-Item ci/apply-build13.ps1 (Join-Path $output 'BUILD13-SOURCE.ps1')
          $buildDate = (Get-Date).ToUniversalTime().ToString('o')
          @"
          Repository: $env:GITHUB_REPOSITORY
          Branch: $env:GITHUB_REF_NAME
          Baseline: 8ecd4e46e2e6df36901940bed05785665fa5474c
          Build 08 source base: e246c796c91b61e98884cfa01e3c44e6b1287e21
          Build 09-r2 parent: c66643f8d03e77018389740fb2e6d885f18b9d7c
          Build 10 parent: 7c20d801753ab5a46aec40a31a20af23e8eb0c1f
          Build 11 final parent: 81b53122760c949aee1b0529c9632585d021e38d
          Build 12 launch parent: 3cdc4069bf1cda5c2ae5fdb45838b429e180b1a2
          Iteration: $env:EXPERIMENT_ITERATION
          Experiment: $env:EXPERIMENT_NAME
          Commit: $env:GITHUB_SHA
          Workflow: $env:GITHUB_WORKFLOW
          Workflow Run ID: $env:GITHUB_RUN_ID
          Workflow Run Number: $env:GITHUB_RUN_NUMBER
          Workflow Attempt: $env:GITHUB_RUN_ATTEMPT
          Build Date: $buildDate
          Artifact: W7-$env:ARTIFACT_BRANCH-$env:EXPERIMENT_ITERATION-$env:EXPERIMENT_NAME
          SafeGPU: Build 13 is a one-axis BUILD 12 derivative; it admits no new graphics pipelines and changes only fragment implementation for eight already-stable Driveclub depthless hashes
          Driveclub native depthless seed: 0xf262db18a573b11b, 0xd6662ec1afe89d73, 0x64dc60f23cf56ca6, 0x0066e5d405cec7dc, 0xa6bbc4863c4524d0, 0x1870824d8db3a02c, 0xbb3816e752b04345, 0x8ef11f7e6600d87a
          Seed behavior: use original guest fragment shader and original guest fragment buffers/images/samplers; BUILD 09-r2 resource suppression therefore no longer applies to these eight hashes
          Descriptor delivery: BUILD 10 regular descriptor-set path retained; VK_KHR_push_descriptor remains disabled in SafeGPU
          Admission boundary: BUILD 12 strict actual Vulkan depth/stencil attachment rejection retained unchanged for ordinary flat-fragment candidates
          Driveclub proven native depth set: BUILD 11's 110 exact native-safe pipeline hashes retained unchanged
          Bloodborne CUSA03173 BUILD 11 quarantine retained: 0x41ce00fd9bac4b92
          DOAX3 CUSA04555 BUILD 11 quarantine retained: 0xae5a792de45aaf76
          Wipeout CUSA05670 BUILD 11 quarantine retained: 0x2dc86d47c8a5b854
          We Are Doomed CUSA02394: three known-good control hashes remain native
          Persistent diagnostic: BUILD 11 last-submitted graphics pipeline tracking retained unchanged
          NullGPU: preserved and takes precedence
          Compute: skipped in SafeGPU before compute shader/pipeline creation
          Source: exact BUILD 13 transform is included as BUILD13-SOURCE.ps1
          "@ | Out-File -Encoding utf8 (Join-Path $output 'BUILD-IDENTITY.txt')

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: W7-${{ env.ARTIFACT_BRANCH }}-${{ env.EXPERIMENT_ITERATION }}-${{ env.EXPERIMENT_NAME }}
          path: artifact
