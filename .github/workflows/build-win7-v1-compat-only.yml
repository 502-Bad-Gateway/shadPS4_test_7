name: Build shadPS4 Win7 V1 attachment diagnostics

on:
  push:
    branches: [win7-v1-compat-only]
    paths:
      - CMakeLists.txt
      - src/**
      - tools/win7-launcher/**
      - ci/**
      - WIN7-V1-COMPATIBILITY-ONLY.md
      - .github/workflows/build-win7-v1-compat-only.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-win7-x64:
    name: Build Windows 7 x64 attachment-diagnostics target
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Fetch llvm-mingw launcher and audit tools
        shell: pwsh
        run: |
          $version = '20260616'
          $archiveName = "llvm-mingw-$version-msvcrt-x86_64.zip"
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          $parent = Join-Path $env:RUNNER_TEMP 'llvm-mingw'
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$version/$archiveName"
          Invoke-WebRequest -Uri $url -OutFile $archive
          Remove-Item -Recurse -Force $parent -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $parent | Out-Null
          Expand-Archive -Path $archive -DestinationPath $parent
          $root = Join-Path $parent "llvm-mingw-$version-msvcrt-x86_64"
          $bin = Join-Path $root 'bin'
          foreach ($tool in @('x86_64-w64-mingw32-clang++.exe',
                              'x86_64-w64-mingw32-windres.exe',
                              'llvm-readobj.exe',
                              'llvm-strings.exe')) {
              if (!(Test-Path (Join-Path $bin $tool))) {
                  throw "llvm-mingw tool not found: $tool"
              }
          }
          "LLVM_MINGW_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Visual Studio build environment
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      - name: Build Vulkan 1.2 Windows 7 validation layer
        shell: pwsh
        run: |
          $validationRoot = Join-Path $env:RUNNER_TEMP 'Vulkan-ValidationLayers-v1.2.198'
          Remove-Item -Recurse -Force $validationRoot -ErrorAction SilentlyContinue
          git clone --depth 1 --branch v1.2.198 `
            https://github.com/KhronosGroup/Vulkan-ValidationLayers.git $validationRoot
          if ($LASTEXITCODE -ne 0) { throw 'Vulkan Validation Layers checkout failed' }
          $env:CFLAGS = '/MT'
          $env:CXXFLAGS = '/MT'
          Push-Location $validationRoot
          try {
              # CMake 4 rejects the pre-3.5 policy declaration used by the
              # Vulkan 1.2-era SPIRV-Headers dependency.  update_deps.py
              # has no command-line passthrough for this cache variable, so
              # add it directly to its dependency CMake command list.
              $updateDeps = Join-Path $validationRoot 'scripts/update_deps.py'
              $updateText = Get-Content -Raw $updateDeps
              $cmakeCommand = "            'cmake', self.repo_dir,"
              $cmakeCommandCount = ([regex]::Matches(
                  $updateText, [regex]::Escape($cmakeCommand))).Count
              if ($cmakeCommandCount -ne 1) {
                  throw 'Unexpected Vulkan Validation Layers update_deps.py layout'
              }
              $updateText = $updateText.Replace(
                  $cmakeCommand,
                  $cmakeCommand + [Environment]::NewLine +
                  "            '-DCMAKE_BUILD_TYPE=Release'," +
                  [Environment]::NewLine +
                  "            '-DCMAKE_POLICY_VERSION_MINIMUM=3.5'," +
                  [Environment]::NewLine +
                  "            '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded'," +
                  [Environment]::NewLine +
                  "            '-DCMAKE_C_FLAGS_RELEASE=/MT'," +
                  [Environment]::NewLine +
                  "            '-DCMAKE_CXX_FLAGS_RELEASE=/MT',")
              Set-Content -Encoding utf8 $updateDeps $updateText
              python scripts/update_deps.py --dir external --arch x64 --config release `
                --generator Ninja --optional tests
              if ($LASTEXITCODE -ne 0) { throw 'Vulkan Validation Layers dependency build failed' }
              cmake -C external/helper.cmake -S . -B build -G Ninja `
                '-DCMAKE_BUILD_TYPE=Release' `
                '-DBUILD_TESTS=OFF' `
                '-DBUILD_WERROR=OFF' `
                '-DBUILD_LAYER_SUPPORT_FILES=OFF' `
                '-DCMAKE_SYSTEM_VERSION=6.1' `
                '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded' `
                '-DCMAKE_C_FLAGS_RELEASE=/MT' `
                '-DCMAKE_CXX_FLAGS_RELEASE=/MT'
              if ($LASTEXITCODE -ne 0) { throw 'Vulkan Validation Layers configure failed' }
              cmake --build build --target install --parallel $env:NUMBER_OF_PROCESSORS
              if ($LASTEXITCODE -ne 0) { throw 'Vulkan Validation Layers build failed' }
          } finally {
              Pop-Location
          }
          $layerDll = Get-ChildItem $validationRoot -Recurse -Filter 'VkLayer_khronos_validation.dll' |
              Where-Object { $_.FullName -match '\\(Release|install|lib|bin)\\' } |
              Select-Object -First 1
          $layerJson = Get-ChildItem $validationRoot -Recurse -Filter 'VkLayer_khronos_validation.json' |
              Select-Object -First 1
          if (!$layerDll -or !$layerJson) {
              throw 'Vulkan Validation Layers build did not produce the validation DLL and manifest'
          }
          "VVL_ROOT=$validationRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VVL_DLL=$($layerDll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VVL_JSON=$($layerJson.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare launcher dependency
        shell: pwsh
        run: |
          $jsonDir = Join-Path $env:GITHUB_WORKSPACE 'tools/win7-launcher/third_party/nlohmann'
          New-Item -ItemType Directory -Force -Path $jsonDir | Out-Null
          Invoke-WebRequest `
            -Uri 'https://raw.githubusercontent.com/nlohmann/json/v3.12.0/single_include/nlohmann/json.hpp' `
            -OutFile (Join-Path $jsonDir 'json.hpp')

      - name: Configure Windows 7 guest Vulkan 1.2 build
        shell: pwsh
        run: |
          $env:SOURCE_DATE_EPOCH = '0'
          $env:TZ = 'UTC'
          $clangCl = Get-Command clang-cl.exe -ErrorAction Stop
          $link = Get-Command link.exe -ErrorAction Stop
          $rc = Get-Command rc.exe -ErrorAction Stop
          $clangVersion = (& $clangCl.Source --version | Out-String)
          if ($clangVersion -notmatch '(?m)^Target:\s+x86_64-pc-windows-msvc\s*$') {
              throw "Unexpected clang-cl target; MSVC/UCRT control axis is not active:`n$clangVersion"
          }
          @(
              "clang-cl=$($clangCl.Source)"
              "link=$($link.Source)"
              "rc=$($rc.Source)"
              $clangVersion.TrimEnd()
          ) | Out-File -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'CLANG-CL-IDENTITY.txt')
          # The unchanged top-level CMakeLists.txt applies -march=x86-64-v3 to x86_64 builds.
          cmake -S . -B build-win7-v1 -G Ninja `
            '-DCMAKE_C_COMPILER=clang-cl' `
            '-DCMAKE_CXX_COMPILER=clang-cl' `
            '-DCMAKE_BUILD_TYPE=Release' `
            '-DENABLE_WINDOWS_7_COMPAT=ON' `
            '-DENABLE_WINDOWS_7_COMPAT_ONLY=ON' `
            '-DENABLE_DISCORD_RPC=OFF' `
            '-DENABLE_UPDATER=OFF' `
            '-DENABLE_TESTS=OFF'
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }

      - name: Build emulator
        shell: pwsh
        run: |
          cmake --build build-win7-v1 --target shadps4 --parallel $env:NUMBER_OF_PROCESSORS
          if ($LASTEXITCODE -ne 0) { throw 'shadPS4 build failed' }

      - name: Build Windows 7 launcher
        shell: pwsh
        run: |
          $bin = Join-Path $env:LLVM_MINGW_ROOT 'bin'
          $cxx = Join-Path $bin 'x86_64-w64-mingw32-clang++.exe'
          $rc = Join-Path $bin 'x86_64-w64-mingw32-windres.exe'
          if (!(Test-Path $rc)) { $rc = Join-Path $bin 'llvm-windres.exe' }
          $launcher = Join-Path $env:GITHUB_WORKSPACE 'tools/win7-launcher'
          $res = Join-Path $env:RUNNER_TEMP 'shadps4-win7-launcher.res'
          $exe = Join-Path $env:RUNNER_TEMP 'shadps4-win7-launcher.exe'
          Push-Location $launcher
          try {
              & $rc '-I' '.' 'launcher.rc' '-O' 'coff' '-o' $res
              if ($LASTEXITCODE -ne 0) { throw 'launcher resource compilation failed' }
              & $cxx '-std=c++17' '-O2' '-DNDEBUG' '-DUNICODE' '-D_UNICODE' `
                  '-D_WIN32_WINNT=0x0601' '-DWINVER=0x0601' '-I' '.' 'main.cpp' $res `
                  '-o' $exe '-mwindows' '-municode' '-static' '-fuse-ld=lld' `
                  '-Wl,--subsystem,windows:6.01' '-Wl,--disable-high-entropy-va' `
                  '-lcomctl32' '-lcomdlg32' '-lshell32' '-lgdi32' '-lole32' '-luuid'
              if ($LASTEXITCODE -ne 0) { throw 'launcher build failed' }
          } finally {
              Pop-Location
          }

      - name: Package and audit artifact
        shell: pwsh
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE 'artifact'
          Remove-Item -Recurse -Force $output -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $emulator = Join-Path $env:GITHUB_WORKSPACE 'build-win7-v1/shadps4.exe'
          if (!(Test-Path $emulator)) { throw 'shadps4.exe was not produced' }
          Copy-Item $emulator (Join-Path $output 'shadps4.exe')
          Copy-Item (Join-Path $env:RUNNER_TEMP 'shadps4-win7-launcher.exe') `
              (Join-Path $output 'shadps4-win7-launcher.exe')
          Copy-Item LICENSE (Join-Path $output 'LICENSE-shadPS4')
          Copy-Item tools/win7-launcher/LICENSE-GPL-2.0-or-later.txt `
              (Join-Path $output 'LICENSE-win7-launcher-GPL-2.0-or-later.txt')
          Copy-Item (Join-Path $env:VVL_ROOT 'LICENSE.txt') `
              (Join-Path $output 'LICENSE-Vulkan-ValidationLayers-Apache-2.0.txt')

          $layerDirectory = Join-Path $output 'vulkan/explicit_layer.d'
          New-Item -ItemType Directory -Force -Path $layerDirectory | Out-Null
          Copy-Item $env:VVL_DLL (Join-Path $layerDirectory 'VkLayer_khronos_validation.dll')
          Copy-Item $env:VVL_JSON (Join-Path $layerDirectory 'VkLayer_khronos_validation.json')
          if (!(Test-Path (Join-Path $layerDirectory 'VkLayer_khronos_validation.dll')) -or
              !(Test-Path (Join-Path $layerDirectory 'VkLayer_khronos_validation.json'))) {
              throw 'App-local Vulkan validation layer package is incomplete'
          }

          Copy-Item (Join-Path $env:RUNNER_TEMP 'CLANG-CL-IDENTITY.txt') `
              (Join-Path $output 'CLANG-CL-IDENTITY.txt')

          $readObj = Join-Path $env:LLVM_MINGW_ROOT 'bin/llvm-readobj.exe'
          $auditPath = Join-Path $output 'PE-AUDIT.txt'
          & $readObj '--file-headers' '--coff-imports' (Join-Path $output 'shadps4.exe') |
              Out-File -Encoding utf8 $auditPath
          $audit = Get-Content -Raw $auditPath
          foreach ($forbidden in @('VirtualAlloc2', 'CreateFileMapping2', 'MapViewOfFile3',
                                   'UnmapViewOfFile2', 'SetThreadDescription',
                                   'GetThreadDescription', 'GetSystemTimePreciseAsFileTime')) {
              if ($audit -match "Name: $([regex]::Escape($forbidden))") {
                  throw "Forbidden post-Win7 static import detected: $forbidden"
              }
          }

          $validationAuditPath = Join-Path $output 'VVL-PE-AUDIT.txt'
          & $readObj '--file-headers' '--coff-imports' `
              (Join-Path $layerDirectory 'VkLayer_khronos_validation.dll') |
              Out-File -Encoding utf8 $validationAuditPath
          $validationAudit = Get-Content -Raw $validationAuditPath
          foreach ($forbidden in @('VirtualAlloc2', 'CreateFileMapping2', 'MapViewOfFile3',
                                   'UnmapViewOfFile2', 'SetThreadDescription',
                                   'GetThreadDescription', 'GetSystemTimePreciseAsFileTime')) {
              if ($validationAudit -match "Name: $([regex]::Escape($forbidden))") {
                  throw "Forbidden post-Win7 static import detected in validation layer: $forbidden"
              }
          }

          $stringsTool = Join-Path $env:LLVM_MINGW_ROOT 'bin/llvm-strings.exe'
          $strings = (& $stringsTool (Join-Path $output 'shadps4.exe') | Out-String)
          foreach ($required in @('Windows 7 compatibility-only settings active',
                                  'Windows 7 Vulkan 1.2 compatibility active',
                                  'pipeline-forensics build forces vkValidation=true',
                                  'Win7 pipeline forensics enabled',
                                  'Win7 pipeline forensics START',
                                  'Win7 pipeline forensics SUCCESS',
                                  'Using app-local Vulkan validation layer path')) {
              if (!$strings.Contains($required)) { throw "Required marker missing: $required" }
          }
          foreach ($forbidden in @('Windows 7 NVIDIA sampler workaround',
                                   'Win7 graphics pipeline state',
                                   'Win7 graphics descriptor layout',
                                   'using static vertex input',
                                   'normalizing mixed attachment sample counts',
                                   'disabling graphics pipeline optimization')) {
              if ($strings.Contains($forbidden)) { throw "GPU/Vulkan experiment leaked: $forbidden" }
          }

          @"
          shadPS4 Windows 7 legacy-attachment diagnostic build

          This build forces vkValidation=true and vkValidationCore=true at runtime and bundles
          a Vulkan Validation Layers v1.2.198 DLL built with a Windows 7 target and static CRT.
          The executable adds artifact\vulkan\explicit_layer.d to VK_LAYER_PATH before Vulkan
          instance discovery, so VK_LAYER_KHRONOS_validation is app-local and does not require
          an SDK installation on the test computer.

          The legacy Vulkan 1.2 path now checks that every render-pass attachment required by the
          pipeline has a matching image view, format, and sample count. A draw with a missing or
          mismatched required attachment is skipped before command recording and logged. This is
          intended to prevent the old NVIDIA driver from receiving an incomplete concrete
          framebuffer while preserving the full forensic event stream.

          This build restores normal renderer behavior after the completed experimental axes.
          It records each legacy NVIDIA Vulkan 1.2 graphics-pipeline creation attempt under:

          user\shader\pipeline_forensics\run_*\

          For the minimal diagnostic test, run Bloodborne once and We Are Doomed once with
          null_gpu=false. Return both the normal test-results archive and the complete
          user\shader\pipeline_forensics folder. A validation message or a pipeline report with
          status=started but no later status=success identifies the first invalid API object or
          call where the driver stopped.
          "@ | Out-File -Encoding ascii (Join-Path $output 'PIPELINE-FORENSICS-README.txt')

          @"
          lineage=clean-upstream-7fb1a530
          upstream_commit=7fb1a530c15415097836521fec6f3483e27c81ae
          phase=windows7-vulkan-legacy-attachment-diagnostics
          single_axis=legacy-attachment-invariant-guard-and-vvl-1.2.198
          validation_forced=true
          validation_layer=VK_LAYER_KHRONOS_validation
          validation_layer_source=vulkan-validationlayers-v1.2.198
          validation_layer_win7_target=true
          validation_layer_static_crt=true
          renderer_behavior_change=skip-invalid-legacy-attachment-draws
          previous_pipeline_optimization_experiment=reverted
          emulator_toolchain=clang-cl-msvc-ucrt
          emulator_target=x86_64-pc-windows-msvc
          launcher_toolchain=llvm-mingw-20260616-msvcrt-x86_64-static
          cpu=x86-64-v3
          null_gpu_default=false
          show_splash_default=true
          show_fps_counter_default=true
          vulkan_compat_scope=presenter-and-guest-rendering
          vulkan_guest_compat_patches=true
          "@ | Out-File -Encoding ascii (Join-Path $output 'BUILD-IDENTITY.txt')

          $hashLines = @(Get-ChildItem $output -File |
              Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
              ForEach-Object {
                  $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
                  "$hash  $($_.Name)"
              } | Sort-Object)
          $hashLines | Out-File -Encoding ascii (Join-Path $output 'SHA256SUMS.txt')

      - name: Upload Windows 7 V1 attachment-diagnostics artifact
        uses: actions/upload-artifact@v7
        with:
          name: shadps4-win7-v1-attachment-diagnostics-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 30
