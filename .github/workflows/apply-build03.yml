name: Apply SafeGPU Build 04 source only

on:
  push:
    branches:
      - build03-applier-20260827
    paths:
      - .github/workflows/apply-build03.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shadps4_clone
          fetch-depth: 0

      - name: Apply Build 04 source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def edit(path, fn):
              p = Path(path)
              old = p.read_text(encoding='utf-8')
              new = fn(old)
              if new == old:
                  raise RuntimeError(f'{path}: expected change was not applied')
              p.write_text(new, encoding='utf-8')

          def safe_cpp(text):
              if text.count('IsBuild03GraphicsPipelineWhitelisted') != 2:
                  raise RuntimeError('unexpected Build 03 whitelist symbol count')
              text = text.replace('IsBuild03GraphicsPipelineWhitelisted',
                                  'IsBuild04GraphicsPipelineWhitelisted')
              text = text.replace('Build 03 admits nothing else.', 'Build 04 admits nothing else.')
              old = ('           !info.has_geometry_shader && !info.has_storage_images && '
                     '!info.has_depth_or_stencil &&\n'
                     '           !info.has_blending && !info.has_logic_op && '
                     'info.num_color_attachments == 1 &&\n')
              new = ('           !info.has_geometry_shader && !info.has_storage_images && '
                     '!info.has_depth_or_stencil &&\n'
                     '           !info.has_logic_op && info.num_color_attachments == 1 &&\n')
              if old not in text:
                  raise RuntimeError('Build 03 blending gate not found')
              text = text.replace(old, new, 1)
              text = text.replace('Build 03 feature gate:', 'Build 04 feature gate:', 1)
              return text

          def safe_h(text):
              text = text.replace('Build 03 requires', 'Build 04 requires', 1)
              text = text.replace('milestone-2-pipeline-whitelist-v1',
                                  'milestone-2-pipeline-whitelist-blending-v1', 1)
              return text

          def pipeline_cache(text):
              count = text.count('Build 03')
              if count < 4:
                  raise RuntimeError(f'unexpected Build 03 log count: {count}')
              return text.replace('Build 03', 'Build 04')

          def tests(text):
              marker = ('    EXPECT_FALSE(VideoCore::SafeGpuGate::ShouldAllowGraphicsPipelineHash(0x0ULL));\n\n'
                        '    basic.has_storage_images = true;')
              insert = ('    EXPECT_FALSE(VideoCore::SafeGpuGate::ShouldAllowGraphicsPipelineHash(0x0ULL));\n\n'
                        '    // Build 04: blending is permitted after the explicit hash whitelist.\n'
                        '    basic.has_blending = true;\n'
                        '    EXPECT_TRUE(VideoCore::SafeGpuGate::ShouldAllowGraphicsPipeline(basic));\n'
                        '    basic.has_logic_op = true;\n'
                        '    EXPECT_FALSE(VideoCore::SafeGpuGate::ShouldAllowGraphicsPipeline(basic));\n'
                        '    basic.has_logic_op = false;\n'
                        '    basic.has_blending = false;\n\n'
                        '    basic.has_storage_images = true;')
              if marker not in text:
                  raise RuntimeError('SafeGPU test insertion point not found')
              return text.replace(marker, insert, 1)

          edit('src/video_core/safe_gpu/safe_gpu.cpp', safe_cpp)
          edit('src/video_core/safe_gpu/safe_gpu.h', safe_h)
          edit('src/video_core/renderer_vulkan/vk_pipeline_cache.cpp', pipeline_cache)
          edit('tests/test_safe_gpu.cpp', tests)
          PY

      - name: Commit Build 04 source
        shell: bash
        run: |
          git diff --check
          git config user.name "502-Bad-Gateway"
          git config user.email "135363699+502-Bad-Gateway@users.noreply.github.com"
          git add -- src/video_core/safe_gpu/safe_gpu.cpp \
                     src/video_core/safe_gpu/safe_gpu.h \
                     src/video_core/renderer_vulkan/vk_pipeline_cache.cpp \
                     tests/test_safe_gpu.cpp
          git commit -m "Add SafeGPU Build 04 whitelist blending [skip ci]"
          git push origin HEAD:shadps4_clone
