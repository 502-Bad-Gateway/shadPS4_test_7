name: Apply SafeGPU Build 03 source patch

on:
  push:
    branches:
      - build03-applier-20260827
    paths:
      - .github/workflows/apply-build03.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shadps4_clone
          fetch-depth: 0

      - name: Apply Build 03 patch
        shell: bash
        run: |
          python -c "import base64; exec(base64.b64decode(''))"

      - name: Commit Build 03 source changes
        shell: bash
        run: |
          git diff --check
          git config user.name "502-Bad-Gateway"
          git config user.email "135363699+502-Bad-Gateway@users.noreply.github.com"
          git add src/video_core/safe_gpu/safe_gpu.h \
                  src/video_core/safe_gpu/safe_gpu.cpp \
                  src/video_core/renderer_vulkan/vk_pipeline_cache.cpp \
                  tests/test_safe_gpu.cpp
          git commit -m "Add SafeGPU Build 03 pipeline whitelist"
          git push origin HEAD:shadps4_clone
