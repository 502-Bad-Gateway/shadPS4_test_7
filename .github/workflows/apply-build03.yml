name: Apply SafeGPU Build 03 source patch

on:
  push:
    branches:
      - build03-applier-20260827
    paths:
      - .github/workflows/apply-build03.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shadps4_clone
          fetch-depth: 0

      - name: Apply Build 03 patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # SafeGPU policy: Build 03 adds an explicit hash allow-list on top of the
          # existing basic vertex/fragment feature classifier.
          replace_once(
              "src/video_core/safe_gpu/safe_gpu.h",
              "// Milestone 2 permits only a conservative, explicitly classified graphics-pipeline subset.",
              "// Build 03 permits only an explicit known-safe pipeline hash set plus the conservative feature classifier.",
          )
          replace_once(
              "src/video_core/safe_gpu/safe_gpu.h",
              '        return "milestone-2-first-graphics-v1";',
              '        return "milestone-2-pipeline-whitelist-v1";',
          )
          replace_once(
              "src/video_core/safe_gpu/safe_gpu.h",
              "    static bool ShouldAllowGraphics() noexcept;\n    static bool ShouldAllowGraphicsPipeline(const SafeGpuGraphicsPipelineInfo& info) noexcept;",
              "    static bool ShouldAllowGraphics() noexcept;\n    static bool ShouldAllowGraphicsPipelineHash(std::uint64_t pipeline_hash) noexcept;\n    static bool ShouldAllowGraphicsPipeline(const SafeGpuGraphicsPipelineInfo& info) noexcept;",
          )

          replace_once(
              "src/video_core/safe_gpu/safe_gpu.cpp",
              """bool IsSimpleDwordRange(const std::uint64_t address, const std::uint32_t num_bytes) noexcept {
    return address != 0 && num_bytes != 0 && (address & 3U) == 0 && (num_bytes & 3U) == 0 &&
           address <= std::numeric_limits<std::uint64_t>::max() - num_bytes;
}
""",
              """bool IsSimpleDwordRange(const std::uint64_t address, const std::uint32_t num_bytes) noexcept {
    return address != 0 && num_bytes != 0 && (address & 3U) == 0 && (num_bytes & 3U) == 0 &&
           address <= std::numeric_limits<std::uint64_t>::max() - num_bytes;
}

bool IsBuild03GraphicsPipelineWhitelisted(const std::uint64_t pipeline_hash) noexcept {
    // These three graphics pipelines are taken from a full-GPU We Are Doomed run that is known
    // to complete on the target Windows 7 / NVIDIA setup. Build 03 admits nothing else.
    switch (pipeline_hash) {
    case 0x8202f0d30159f803ULL:
    case 0x762f3099a689a76fULL:
    case 0x10dc0563ad6f6258ULL:
        return true;
    default:
        return false;
    }
}
""",
          )
          replace_once(
              "src/video_core/safe_gpu/safe_gpu.cpp",
              """bool SafeGpuGate::ShouldAllowGraphics() noexcept {
    return GetEffectiveMode() != EffectiveGpuMode::NullGPU;
}

bool SafeGpuGate::ShouldAllowGraphicsPipeline(
""",
              """bool SafeGpuGate::ShouldAllowGraphics() noexcept {
    return GetEffectiveMode() != EffectiveGpuMode::NullGPU;
}

bool SafeGpuGate::ShouldAllowGraphicsPipelineHash(const std::uint64_t pipeline_hash) noexcept {
    const auto mode = GetEffectiveMode();
    if (mode == EffectiveGpuMode::FullGPU) {
        return true;
    }
    return mode == EffectiveGpuMode::SafeGPU &&
           IsBuild03GraphicsPipelineWhitelisted(pipeline_hash);
}

