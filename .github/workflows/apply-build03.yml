name: Fix SafeGPU Builds 05 06 07

on:
  push:
    branches: [build03-applier-20260827]
    paths: [.github/workflows/apply-build03.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shadps4_clone_build05
          fetch-depth: 0

      - name: Patch all three experiment branches
        shell: bash
        run: |
          git config user.name "502-Bad-Gateway"
          git config user.email "135363699+502-Bad-Gateway@users.noreply.github.com"
          git fetch origin

          for branch in shadps4_clone_build05 shadps4_clone_build06 shadps4_clone_build07; do
            git checkout -B "$branch" "origin/$branch"
            python - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/video_core/renderer_vulkan/vk_pipeline_cache.cpp")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r"(?m)^(?P<i>[ \t]*)\.has_blending = has_blending,\n"
              r"(?P=i)\.pipeline_hash = pipeline_hash,\n"
              r"(?P=i)\.has_logic_op =\n"
              r"(?P<c>[ \t]*)graphics_key\.logic_op != AmdGpu::ColorControl::LogicOp::Copy,\n"
          )
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise RuntimeError(f"expected exactly one initializer-order match, found {len(matches)}")
          m = matches[0]
          i = m.group("i")
          c = m.group("c")
          replacement = (
              f"{i}.has_blending = has_blending,\n"
              f"{i}.has_logic_op =\n"
              f"{c}graphics_key.logic_op != AmdGpu::ColorControl::LogicOp::Copy,\n"
              f"{i}.pipeline_hash = pipeline_hash,\n"
          )
          path.write_text(text[:m.start()] + replacement + text[m.end():], encoding="utf-8")
          PY
            git diff --check
            git add src/video_core/renderer_vulkan/vk_pipeline_cache.cpp
            git commit -m "Fix SafeGPU designated initializer order"
            git push origin "HEAD:$branch"
          done
