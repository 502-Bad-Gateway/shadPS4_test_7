name: Fix SafeGPU Builds 05 06 07

on:
  push:
    branches: [build03-applier-20260827]
    paths: [.github/workflows/apply-build03.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shadps4_clone_build05
          fetch-depth: 0

      - name: Patch all three experiment branches
        shell: bash
        run: |
          git config user.name "502-Bad-Gateway"
          git config user.email "135363699+502-Bad-Gateway@users.noreply.github.com"
          git fetch origin

          for branch in shadps4_clone_build05 shadps4_clone_build06 shadps4_clone_build07; do
            git checkout -B "$branch" "origin/$branch"
            python - <<'PY'
          from pathlib import Path

          path = Path("src/video_core/renderer_vulkan/vk_pipeline_cache.cpp")
          text = path.read_text(encoding="utf-8")
          old = '''                .has_blending = has_blending,
                .pipeline_hash = pipeline_hash,
                .has_logic_op =
                    graphics_key.logic_op != AmdGpu::ColorControl::LogicOp::Copy,
          '''
          new = '''                .has_blending = has_blending,
                .has_logic_op =
                    graphics_key.logic_op != AmdGpu::ColorControl::LogicOp::Copy,
                .pipeline_hash = pipeline_hash,
          '''
          count = text.count(old)
          if count != 1:
              raise RuntimeError(f"expected exactly one initializer-order match, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
            git diff --check
            git add src/video_core/renderer_vulkan/vk_pipeline_cache.cpp
            git commit -m "Fix SafeGPU designated initializer order"
            git push origin "HEAD:$branch"
          done
