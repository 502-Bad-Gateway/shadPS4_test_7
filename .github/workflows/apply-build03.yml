              "    // Build 03 feature gate: allow only a basic vertex/fragment, single-target,\n",
          )

          # Prevent unknown graphics pipelines from reaching vkCreateGraphicsPipelines. Also skip
          # cache warm-up in SafeGPU so cached graphics/compute pipelines cannot bypass the gate.
          replace_once(
              "src/video_core/renderer_vulkan/vk_pipeline_cache.cpp",
              '#include "video_core/renderer_vulkan/vk_shader_util.h"\n',
              '#include "video_core/renderer_vulkan/vk_shader_util.h"\n#include "video_core/safe_gpu/safe_gpu.h"\n',
          )
          replace_once(
              "src/video_core/renderer_vulkan/vk_pipeline_cache.cpp",
              "    WarmUp();\n",
              """    if (VideoCore::SafeGpuGate::IsEnabled()) {
        LOG_INFO(Render_Vulkan,
                 "[SafeGPU] SKIP pipeline cache warm-up for Build 03; cached graphics/compute "
                 "pipelines must not bypass the fail-closed policy");
    } else {
        WarmUp();
