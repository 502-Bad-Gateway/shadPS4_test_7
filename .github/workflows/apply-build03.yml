name: Fix SafeGPU Build 03 source typo

on:
  push:
    branches:
      - build03-applier-20260827
    paths:
      - .github/workflows/apply-build03.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shadps4_clone
          fetch-depth: 0

      - name: Fix Build 03 include typo
        shell: bash
        run: |
          python -c "import base64; exec(base64.b64decode(''))"

      - name: Commit include fix
        shell: bash
        run: |
          git diff --check
          git config user.name "502-Bad-Gateway"
          git config user.email "135363699+502-Bad-Gateway@users.noreply.github.com"
          git add src/video_core/renderer_vulkan/vk_pipeline_cache.cpp
          git commit -m "Fix Build 03 SafeGPU includes"
          git push origin HEAD:shadps4_clone
